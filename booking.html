<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking – Logichain</title>

<!-- FAVICON -->
<link rel="icon" type="image/png" href="assets/favicon.png">

<!-- MAPBOX -->
<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />

<style>
/* ---------- THEME ---------- */
:root {
    --bg:#121212;
    --card:#1e1e1e;
    --primary:#0a66c2;
    --text:#f5f5f5;
    --muted:#aaa;
    --shadow:rgba(0,0,0,0.6);
}

body{
    margin:0;
    font-family:Inter, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

a{color:var(--primary);text-decoration:none}
.container{max-width:1200px;margin:28px auto;padding:20px}

/* ---------- HEADER ---------- */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #333;
    padding-bottom:12px;
}
.logo{
    font-weight:700;
    letter-spacing:2px;
    font-size:1.6em;
    color:var(--primary);
}
nav a{margin-left:18px;font-weight:500}

/* ---------- LAYOUT ---------- */
.grid{
    display:grid;
    grid-template-columns:1fr 420px;
    gap:24px;
    margin-top:20px;
}
@media(max-width:900px){
    .grid{grid-template-columns:1fr}
}

.card{
    background:var(--card);
    padding:24px;
    border-radius:12px;
    box-shadow:0 6px 20px var(--shadow);
}

.map{
    height:320px;
    border-radius:8px;
    border:1px solid #333;
}

/* ---------- FORM ---------- */
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
input,select,textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #333;
    background:#1a1a1a;
    color:#fff;
    margin-bottom:12px;
}
.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
button{
    padding:12px 20px;
    border-radius:8px;
    border:none;
    background:var(--primary);
    color:#fff;
    font-weight:600;
    cursor:pointer;
}
button.secondary{
    background:#2a2a2a;
    color:var(--primary);
}

/* ---------- NON STACKABLE ---------- */
.nonstack-row{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
}
.info-btn{
    width:22px;
    height:22px;
    border-radius:999px;
    border:none;
    background:var(--primary);
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}
.info-box{
    display:none;
    position:absolute;
    top:32px;
    left:0;
    background:#222;
    padding:12px;
    border-radius:8px;
    font-size:13px;
    width:260px;
    box-shadow:0 6px 20px rgba(0,0,0,0.7);
    z-index:10;
}

/* ---------- SUMMARY ---------- */
.price{
    font-size:22px;
    font-weight:700;
    color:var(--primary);
    margin-top:10px;
}
.muted{color:var(--muted);font-size:13px}

footer{
    text-align:center;
    margin-top:32px;
    color:var(--muted);
    font-size:0.9em;
}
</style>
</head>

<body>
<div class="container">

<header>
    <div class="logo">LOGICHAIN</div>
    <nav><a href="index.html">Forside</a></nav>
</header>

<main class="grid">

<!-- LEFT -->
<div>
    <div class="card" style="margin-bottom:20px">
        <h3>Rute</h3>
        <div id="map" class="map"></div>
    </div>

    <div class="card">
        <h3>Oppsummering</h3>
        <div>Distanse: <span id="distanceText">—</span></div>
        <div>Estimert levering: <span id="etaText">—</span></div>
        <div class="price" id="priceText">—</div>
        <div class="muted" id="priceNote">—</div>
    </div>
</div>

<!-- RIGHT -->
<form class="card">
    <h3>Forsendelse</h3>

    <div class="two-col">
        <div>
            <label>Avsender land</label>
            <input value="Norway">
        </div>
        <div>
            <label>Mottaker land</label>
            <input value="Norway">
        </div>
    </div>

    <label>Avsender adresse</label>
    <input placeholder="Gate, postnr, sted">

    <label>Mottaker adresse</label>
    <input placeholder="Gate, postnr, sted">

    <div class="two-col">
        <div>
            <label>Vekt (kg)</label>
            <input type="number" value="10">
        </div>
        <div>
            <label>Størrelse (L×B×H cm)</label>
            <input placeholder="120x80x60">
        </div>
    </div>

    <div class="nonstack-row">
        <input type="checkbox" id="nonStack">
        <span>Non-stackable</span>
        <button type="button" class="info-btn" onclick="toggleInfo()">i</button>
        <div id="infoBox" class="info-box">
            Non-stackable betyr at godset ikke kan stables med annet gods.
            Dette kan gi pristillegg.
        </div>
    </div>

    <label>Service</label>
    <select>
        <option>Standard</option>
        <option>Economy</option>
        <option>Express</option>
    </select>

    <button type="button" onclick="calculate()">Beregn</button>
    <button type="submit" class="secondary">Send forespørsel</button>
</form>

</main>

<footer>© 2025 Logichain AS</footer>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
<script>
mapboxgl.accessToken = 'DIN_MAPBOX_TOKEN';

const map = new mapboxgl.Map({
    container:'map',
    style:'mapbox://styles/mapbox/dark-v11',
    center:[10.7522,59.9139],
    zoom:5
});

function toggleInfo(){
    const box=document.getElementById('infoBox');
    box.style.display = box.style.display==='block'?'none':'block';
}

function calculate(){
    const distance = 420; // demo
    let price = distance * 3.8;

    if(document.getElementById('nonStack').checked){
        price *= 1.15;
        document.getElementById('priceNote').innerText='Inkl. non-stackable tillegg';
    } else {
        document.getElementById('priceNote').innerText='';
    }

    document.getElementById('distanceText').innerText = distance+' km';
    document.getElementById('etaText').innerText = '2 dager';
    document.getElementById('priceText').innerText = Math.round(price)+' kr';
}
</script>

</body>
</html>
