<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking – Logichain</title>

<link rel="icon" type="image/png" href="assets/favicon.png">

<style>
:root{
--bg:#0b0f16;
--card:#161b26;
--border:#2a3040;
--text:#e8e8e8;
--muted:#9aa3b2;
--accent:#3ea6ff;
--success:#3ddc97;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}
.container{
max-width:1200px;
margin:auto;
padding:28px;
}
header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
padding-bottom:16px;
margin-bottom:24px;
}
.logo{
font-size:1.6em;
font-weight:800;
letter-spacing:2px;
color:var(--accent);
}
nav a{
margin-left:18px;
color:var(--muted);
text-decoration:none;
font-size:.9em;
}
nav a:hover{color:#fff}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:26px;
}
.card{
background:var(--card);
padding:24px;
border-radius:16px;
border:1px solid var(--border);
box-shadow:0 12px 40px rgba(0,0,0,.4);
}
h1,h2,h3{margin:0 0 12px}
label{
font-size:.85em;
color:var(--muted);
display:block;
margin-bottom:6px;
}
input,select,textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid var(--border);
background:#0e1320;
color:#fff;
margin-bottom:14px;
}
textarea{min-height:90px}
button{
padding:12px 18px;
border:none;
border-radius:10px;
background:var(--accent);
font-weight:700;
cursor:pointer;
}
button.secondary{
background:#22283a;
color:var(--accent);
}
button:hover{opacity:.9}

.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.tooltip{
position:relative;
display:inline-block;
cursor:help;
}
.tooltip span{
visibility:hidden;
position:absolute;
bottom:140%;
left:50%;
transform:translateX(-50%);
background:#111;
color:#fff;
padding:10px;
border-radius:8px;
font-size:.8em;
width:220px;
text-align:center;
border:1px solid var(--border);
}
.tooltip:hover span{visibility:visible}

.carrier{
display:flex;
justify-content:space-between;
align-items:center;
background:#0f1422;
padding:16px;
border-radius:12px;
margin-top:12px;
border:1px solid var(--border);
}
.carrier.best{
border:2px solid var(--success);
}
.price{
font-size:1.1em;
font-weight:800;
}
.small{font-size:.8em;color:var(--muted)}

.selected{
margin-top:18px;
padding:16px;
border-radius:12px;
background:#0f1c2b;
border:1px solid var(--accent);
}

footer{
margin-top:40px;
text-align:center;
font-size:.85em;
color:var(--muted);
}
</style>
</head>

<body>
<div class="container">

<header>
<div class="logo">LOGICHAIN</div>
<nav>
<a href="#">Forside</a>
<a href="#">Book</a>
<a href="#">Kontakt</a>
</nav>
</header>

<h1>Transport booking</h1>
<p class="small">Sammenlign leverandører – velg beste pris</p>

<div class="grid">

<!-- INPUT -->
<div class="card">
<h3>Forsendelsesdetaljer</h3>

<label>Avsender adresse</label>
<input placeholder="Gate, postnr, by">

<label>Mottaker adresse</label>
<input placeholder="Gate, postnr, by">

<div class="row">
<div>
<label>Vekt (kg)</label>
<input id="weight" type="number" value="800">
</div>
<div>
<label>Volum (m³)</label>
<input id="volume" type="number" value="3">
</div>
</div>

<label style="display:flex;align-items:center;gap:8px">
<input type="checkbox" id="nonstack">
Ikke stablbart
<div class="tooltip">ℹ️
<span>Godset kan ikke stables. Dette øker pris og begrenser leverandørvalg.</span>
</div>
</label>

<label>Tjenestenivå</label>
<select id="service">
<option value="economy">Economy</option>
<option value="standard" selected>Standard</option>
<option value="express">Express</option>
</select>

<label>Kommentar</label>
<textarea placeholder="Tidsvindu, truck, rampe, etc."></textarea>

<button onclick="calculate()">Beregn priser</button>
</div>

<!-- RESULT -->
<div class="card">
<h3>Leverandører</h3>
<div id="results" class="small">Ingen beregning enda</div>
<div id="selected"></div>
</div>

</div>

<footer>© 2025 Logichain – All rights reserved</footer>

</div>

<script>
function calculate(){
const weight = +document.getElementById("weight").value;
const volume = +document.getElementById("volume").value;
const nonstack = document.getElementById("nonstack").checked;
const service = document.getElementById("service").value;

const distance = 520;

let carriers = [
{name:"Bring",rate:3.1},
{name:"Posten",rate:3.5},
{name:"DHL",rate:4.2},
{name:"DSV",rate:4.9}
];

let prices = carriers.map(c=>{
let p = distance*c.rate;
p += weight*1.2;
p += volume*380;
if(nonstack) p+=1200;
if(service==="express") p*=1.25;
if(service==="economy") p*=0.9;
return {name:c.name,price:Math.round(p)};
});

prices.sort((a,b)=>a.price-b.price);

document.getElementById("results").innerHTML =
prices.map((p,i)=>`
<div class="carrier ${i===0?'best':''}">
<div>
<strong>${p.name}</strong><br>
<span class="small">${i===0?'Beste pris':''}</span>
</div>
<div style="text-align:right">
<div class="price">${p.price} kr</div>
<button onclick="selectCarrier('${p.name}',${p.price})">Velg</button>
</div>
</div>
`).join("");
}

function selectCarrier(name,price){
document.getElementById("selected").innerHTML=`
<div class="selected">
<strong>Valgt leverandør</strong><br><br>
${name}<br>
Pris: <strong>${price} kr</strong><br><br>
<button class="secondary">Send booking</button>
</div>
`;
}
</script>

</body>
</html>
