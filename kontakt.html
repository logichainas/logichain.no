<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <title>Kontakt – Logichain</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script defer src="assets/scripts.js"></script>
    <style>
        /* Inline improvements for the shipping form */
        .shipping-form {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg, #ffffff);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .shipping-form h2 {
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }

        .shipping-form label {
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .shipping-form input,
        .shipping-form textarea,
        .shipping-form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .info-icon {
            background:#0a66c2;
            color:#fff;
            padding:1px 7px;
            border-radius:50%;
            font-size:13px;
            cursor:pointer;
        }

        .shipping-form button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            background: #0a3d62;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        .shipping-form button:hover {
            background: #08405c;
        }
    </style>
</head>

<body>
<header>
    <nav class="navbar">
        <div class="logo">LOGICHAIN</div>
        <ul class="nav-links">
            <li><a href="index.html">Hjem</a></li>
            <li><a href="om.html">Om oss</a></li>
            <li><a href="tjenester.html">Tjenester</a></li>
            <li><a href="karriere.html">Karriere</a></li>
            <li><a href="kontakt.html" class="active">Kontakt</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle">🌓</button>
    </nav>
</header>

<section class="page-header">
    <h1>Kontakt oss</h1>
    <p>Vi svarer vanligvis innen 24 timer.</p>
</section>

<section class="contact">
    <form class="shipping-form" action="mailto:einar@logichain.no" method="POST" enctype="text/plain" style="max-width:600px; margin:auto; font-family:Arial;">
    <h2>Shipping Request</h2>

    <label>Sender Country</label><br>
    <input type="text" name="sender_country" required style="width:100%; padding:8px; margin-bottom:12px;">

    <label>Sender Address</label><br>
    <input type="text" name="sender_address" required style="width:100%; padding:8px; margin-bottom:12px;">

    <label>Package Weight (kg)</label><br>
    <input type="number" name="weight" step="0.01" required style="width:100%; padding:8px; margin-bottom:12px;">

    <label>Package Size (L × W × H cm)</label><br>
    <input type="text" name="size" placeholder="e.g. 120 × 80 × 60" required style="width:100%; padding:8px; margin-bottom:12px;">

    <label>Receiver Country</label><br>
    <input type="text" name="receiver_country" required style="width:100%; padding:8px; margin-bottom:12px;">

    <label>Receiver Address</label><br>
    <input type="text" name="receiver_address" required style="width:100%; padding:8px; margin-bottom:12px;">

    <div style="margin-top:12px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" name="non_stackable">
            Non-stackable
            <span style="background:#0077cc; color:#fff; padding:2px 6px; border-radius:50%; font-size:12px; cursor:pointer;" title="Non-stackable means the shipment cannot have other goods stacked on top of it due to fragility or shape.">i</span>
        </label>
    </div>

    <button type="submit" style="margin-top:20px; padding:10px 18px; background:#0a3d62; color:white; border:none; cursor:pointer; width:100%; font-size:16px;">Send Request</button>
</form>

    <div class="contact-info">
        <h3>Kontaktinformasjon</h3>
        <p>E-post: einar@logichain.no</p>
    </div>
</section>

<!-- Improved Shipping Inquiry Form -->
<form class="shipping-form" action="mailto:post@logichain.no" method="POST">
    <h2>Shipping Request</h2>

    <label for="sender_country">Sender Country</label>
    <input type="text" id="sender_country" name="sender_country" required />

    <label for="sender_address">Sender Address</label>
    <input type="text" id="sender_address" name="sender_address" required />

    <label for="weight">Package Weight (kg)</label>
    <input type="number" id="weight" name="weight" step="0.01" required />

    <label for="size">Package Size (L × W × H cm)</label>
    <input type="text" id="size" name="size" placeholder="e.g. 120 × 80 × 60" required />

    <label for="receiver_country">Receiver Country</label>
    <input type="text" id="receiver_country" name="receiver_country" required />

    <label for="receiver_address">Receiver Address</label>
    <input type="text" id="receiver_address" name="receiver_address" required />

    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" name="non_stackable" />
        Non-stackable
        <span class="info-icon" title="Non-stackable means this shipment cannot have any cargo stacked on top due to fragility or shape.">i</span>
    </label>

    <button type="submit">Send Request</button>
</form>

<footer>
    <p>© 2025 Logichain</p>
</footer>
</body>
</html>
