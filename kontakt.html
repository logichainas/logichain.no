<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Kontakt – Logichain</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script defer src="assets/scripts.js"></script>
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">LOGICHAIN</div>
        <ul class="nav-links">
            <li><a href="index.html">Hjem</a></li>
            <li><a href="om.html">Om oss</a></li>
            <li><a href="tjenester.html">Tjenester</a></li>
            <li><a href="karriere.html">Karriere</a></li>
            <li><a href="kontakt.html" class="active">Kontakt</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle">🌓</button>
    </nav>
</header>

<section class="page-header">
    <h1>Kontakt oss</h1>
    <p>Vi svarer vanligvis innen 24 timer.</p>
</section>

<section class="contact">

    <form class="contact-form" action="mailto:post@logichain.no" method="POST">
        <input type="text" name="navn" placeholder="Navn" required>
        <input type="email" name="email" placeholder="E-post" required>
        <textarea name="melding" placeholder="Melding" required></textarea>
        <button type="submit">Send melding</button>
    </form>

    <div class="contact-info">
        <h3>Kontaktinformasjon</h3>
        <p>E-post: post@logichain.no</p>
    </div>

</section>

<footer>
    <p>© 2025 Logichain</p>
</footer>

</body>
</html>
